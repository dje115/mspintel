[project]
name = "connector-lab"
version = "0.1.0"
description = "Connector Lab development mock vendor APIs for MSPIntel."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "httpx>=0.27.0",
  "pytest>=8.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"
