services:
  frontend:
    container_name: mspintel-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      VITE_APP_VERSION: ${MSPINTEL_APP_VERSION:-1.3}
      # Same-origin API via Vite proxy (avoids browser CORS). Overrides host .env for Compose.
      VITE_API_BASE_URL: ""
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    container_name: mspintel-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MSPINTEL_APP_VERSION: ${MSPINTEL_APP_VERSION:-1.3}
      # Reliable local UI access when .env is wrong or missing (browser Origin is localhost:5173).
      ENVIRONMENT: development
      BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
      - mailpit

  worker:
    container_name: mspintel-worker
    build:
      context: ./worker
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MSPINTEL_APP_VERSION: ${MSPINTEL_APP_VERSION:-1.3}
    volumes:
      - ./worker:/app
    depends_on:
      - redis
      - postgres

  postgres:
    container_name: mspintel-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mspintel
      POSTGRES_USER: mspintel
      POSTGRES_PASSWORD: mspintel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    container_name: mspintel-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mailpit:
    container_name: mspintel-mailpit
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  redis_data:
