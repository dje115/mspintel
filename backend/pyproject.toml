[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mspintel-backend"
version = "0.1.0"
description = "mspintel FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "pydantic-settings>=2.5.2",
  "psycopg[binary]>=3.2.1"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.5"
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "I"]
