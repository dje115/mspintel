[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mspintel-worker"
version = "0.1.0"
description = "mspintel background worker"
requires-python = ">=3.11"
dependencies = [
  "pydantic-settings>=2.5.2",
  "redis>=5.0.8"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.5"
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "I"]
